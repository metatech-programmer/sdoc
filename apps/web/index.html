<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <title>SDOC · Un nuevo formato de archivo para documentos vivos</title>
    <meta name="description" content="SDOC es un nuevo formato de archivo abierto (.sdoc): colaborativo, offline-first, firmable, cifrable y siempre portable. Hecho en Colombia." />
    <meta name="keywords" content="sdoc, formato de archivo, documento, colaboración tiempo real, CRDT, Yjs, PDF, DOCX, exportar, offline, open source, Colombia" />
    <meta name="author" content="SDOC Platform" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="SDOC" />
    <meta property="og:title" content="SDOC · Un nuevo formato de archivo para documentos vivos" />
    <meta property="og:description" content="Colaborativo, offline-first, firmable, cifrable. Open source (MIT)." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SDOC - Nuevo formato de archivo abierto" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SDOC · Un nuevo formato de archivo para documentos vivos" />
    <meta name="twitter:description" content="Colaborativo, offline-first, open source. Hecho en Colombia." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- DNS Prefetch & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Editorial typography: Fraunces (serif) + Inter (sans) + JetBrains Mono -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- No-FOUC bg -->
    <style>
      html { background: #FAFAF7; }
      @media (prefers-color-scheme: dark) { html { background: #0B0E14; } }
      body { margin: 0; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;">SDOC necesita JavaScript habilitado para funcionar. Activalo y recarga.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
