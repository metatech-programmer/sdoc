# ============================================================
# SDOC · Stack de demo mínimo (3 contenedores en vez de 23).
# Solo lo que necesitas para ver la app funcionando localmente.
# Uso: docker compose -f docker-compose.demo.yml up -d
# ============================================================

services:
  # Frontend SDOC (Vite preview) — http://localhost:3000
  sdoc-web:
    image: node:20-alpine
    container_name: sdoc-web
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_DEMO_MODE=true
      - HOST=0.0.0.0
    command: sh -c "cd apps/web && npm install --prefix ../.. && npm run dev -- --host"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL para persistencia (opcional, no requerido por demo mode)
  postgres:
    image: postgres:16-alpine
    container_name: sdoc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sdoc_db
      POSTGRES_USER: sdoc
      POSTGRES_PASSWORD: sdoc_demo_pw_change_me
    volumes:
      - sdoc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdoc -d sdoc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para sesiones (opcional)
  redis:
    image: redis:7.2-alpine
    container_name: sdoc-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass sdoc_demo_pw_change_me
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sdoc_demo_pw_change_me", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sdoc_pg:
