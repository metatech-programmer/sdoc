# ============================================================
# SDOC Platform — Docker Compose (Desarrollo Local)
# Incluye: infraestructura + microservicios + observabilidad
# ============================================================

x-java-service: &java-service-defaults
  restart: unless-stopped
  networks:
    - sdoc-net
  env_file:
    - .env
  environment:
    - SPRING_PROFILES_ACTIVE=docker
    - CONFIG_SERVER_URI=http://config-server:8888
    - EUREKA_URL=http://eureka:8761/eureka/
    - VAULT_ADDR=http://vault:8200
    - JAVA_OPTS=-XX:+UseVirtualThreads -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    vault:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    config-server:
      condition: service_healthy
    eureka:
      condition: service_healthy

services:

  # ===========================================================
  # BASES DE DATOS E INFRAESTRUCTURA
  # ===========================================================

  postgres:
    image: postgres:16-alpine
    container_name: sdoc-postgres
    restart: unless-stopped
    networks:
      - sdoc-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sdoc_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdoc} -d ${POSTGRES_DB:-sdoc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: sdoc-redis
    restart: unless-stopped
    networks:
      - sdoc-net
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================
  # KAFKA
  # ===========================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sdoc-zookeeper
    restart: unless-stopped
    networks:
      - sdoc-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sdoc-kafka
    restart: unless-stopped
    networks:
      - sdoc-net
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: sdoc-schema-registry
    restart: unless-stopped
    networks:
      - sdoc-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8091:8081"

  schema-registry-ui:
    image: landoop/schema-registry-ui:latest
    container_name: sdoc-schema-registry-ui
    restart: unless-stopped
    networks:
      - sdoc-net
    depends_on:
      - schema-registry
    environment:
      SCHEMAREGISTRY_URL: http://schema-registry:8081
      PROXY: "true"
    ports:
      - "8092:8000"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sdoc-kafka-ui
    restart: unless-stopped
    networks:
      - sdoc-net
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: sdoc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "8089:8080"

  # Inicialización de topics Kafka
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sdoc-kafka-init
    networks:
      - sdoc-net
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../../kafka/topics.sh:/topics.sh:ro
    command: bash /topics.sh
    restart: "no"

  # ===========================================================
  # MINIO (Object Storage)
  # ===========================================================

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: sdoc-minio
    restart: unless-stopped
    networks:
      - sdoc-net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sdoc-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: sdoc-minio-init
    networks:
      - sdoc-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-sdoc-admin} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/sdoc-documents;
      mc mb --ignore-existing local/sdoc-assets;
      mc mb --ignore-existing local/sdoc-versions;
      mc mb --ignore-existing local/sdoc-exports;
      mc mb --ignore-existing local/sdoc-previews;
      mc anonymous set download local/sdoc-previews;
      echo 'Buckets MinIO creados correctamente';
      "
    restart: "no"

  # ===========================================================
  # KEYCLOAK (Identity Provider)
  # ===========================================================

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: sdoc-keycloak
    restart: unless-stopped
    networks:
      - sdoc-net
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sdoc_db}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-sdoc}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ../../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ===========================================================
  # HASHICORP VAULT (Secrets Management)
  # ===========================================================

  vault:
    image: hashicorp/vault:1.16
    container_name: sdoc-vault
    restart: unless-stopped
    networks:
      - sdoc-net
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    command: server -dev
    volumes:
      - vault-data:/vault/data
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  vault-init:
    image: hashicorp/vault:1.16
    container_name: sdoc-vault-init
    networks:
      - sdoc-net
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ../../vault/vault-init.sh:/vault-init.sh:ro
    entrypoint: sh /vault-init.sh
    restart: "no"

  # ===========================================================
  # OPEN POLICY AGENT (Autorización)
  # ===========================================================

  opa:
    image: openpolicyagent/opa:0.65.0
    container_name: sdoc-opa
    restart: unless-stopped
    networks:
      - sdoc-net
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies
    volumes:
      - ../../opa/policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================
  # NGINX (Reverse Proxy)
  # ===========================================================

  nginx:
    image: nginx:1.25-alpine
    container_name: sdoc-nginx
    restart: unless-stopped
    networks:
      - sdoc-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway

  # ===========================================================
  # SPRING CLOUD INFRASTRUCTURE
  # ===========================================================

  config-server:
    build:
      context: ../../services/config-server
      dockerfile: Dockerfile
    container_name: sdoc-config-server
    restart: unless-stopped
    networks:
      - sdoc-net
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - VAULT_ADDR=http://vault:8200
      - CONFIG_REPO_URI=file:///config-repo
    volumes:
      - ../../config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  eureka:
    build:
      context: ../../services/eureka-server
      dockerfile: Dockerfile
    container_name: sdoc-eureka
    restart: unless-stopped
    networks:
      - sdoc-net
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: sdoc-api-gateway
    restart: unless-stopped
    networks:
      - sdoc-net
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ===========================================================
  # MICROSERVICIOS DE NEGOCIO
  # ===========================================================

  auth-service:
    <<: *java-service-defaults
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: sdoc-auth-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  document-service:
    <<: *java-service-defaults
    build:
      context: ../../services/document-service
      dockerfile: Dockerfile
    container_name: sdoc-document-service
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  asset-service:
    <<: *java-service-defaults
    build:
      context: ../../services/asset-service
      dockerfile: Dockerfile
    container_name: sdoc-asset-service
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  version-service:
    <<: *java-service-defaults
    build:
      context: ../../services/version-service
      dockerfile: Dockerfile
    container_name: sdoc-version-service
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  sync-service:
    <<: *java-service-defaults
    build:
      context: ../../services/sync-service
      dockerfile: Dockerfile
    container_name: sdoc-sync-service
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  notification-service:
    <<: *java-service-defaults
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: sdoc-notification-service
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  render-service:
    build:
      context: ../../services/render-service
      dockerfile: Dockerfile
    container_name: sdoc-render-service
    restart: unless-stopped
    networks:
      - sdoc-net
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  render-worker:
    build:
      context: ../../services/render-service
      dockerfile: Dockerfile.worker
    container_name: sdoc-render-worker
    restart: unless-stopped
    networks:
      - sdoc-net
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ===========================================================
  # FRONTEND
  # ===========================================================

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: sdoc-web
    restart: unless-stopped
    networks:
      - sdoc-net
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_KEYCLOAK_URL=http://localhost:8090
      - VITE_KEYCLOAK_REALM=sdoc
      - VITE_KEYCLOAK_CLIENT_ID=sdoc-web
      - VITE_WS_URL=ws://localhost:8080
    ports:
      - "3000:3000"

  # ===========================================================
  # OBSERVABILIDAD
  # ===========================================================

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sdoc-prometheus
    restart: unless-stopped
    networks:
      - sdoc-net
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: sdoc-grafana
    restart: unless-stopped
    networks:
      - sdoc-net
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.0.0
    container_name: sdoc-loki
    restart: unless-stopped
    networks:
      - sdoc-net
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: sdoc-promtail
    restart: unless-stopped
    networks:
      - sdoc-net
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sdoc-jaeger
    restart: unless-stopped
    networks:
      - sdoc-net
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"   # Jaeger HTTP

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sdoc-alertmanager
    restart: unless-stopped
    networks:
      - sdoc-net
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"

  # ============================================================
  # UNLEASH — Feature Flags (self-hosted)
  # ============================================================
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: sdoc-unleash
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdoc}:${POSTGRES_PASSWORD}@postgres:5432/unleash_db
      DATABASE_SSL: "false"
      UNLEASH_DEFAULT_ADMIN_USERNAME: admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_ADMIN_PASSWORD:-admin-secret}
      AUTH_TYPE: OPEN
      LOG_LEVEL: warn
    ports:
      - "4242:4242"
    networks:
      - sdoc-net
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # FLOWER — Monitoreo de colas Celery
  # ============================================================
  render-flower:
    image: mher/flower:2.0
    container_name: sdoc-render-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "5555:5555"
    networks:
      - sdoc-net
    depends_on:
      redis:
        condition: service_healthy

# ===========================================================
# REDES Y VOLÚMENES
# ===========================================================

networks:
  sdoc-net:
    driver: bridge
    name: sdoc-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:
  minio-data:
  vault-data:
  prometheus-data:
  grafana-data:
  loki-data:
  jaeger-data:
  alertmanager-data:
