global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    platform: sdoc

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus se auto-monitorea
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Spring Cloud Infrastructure
  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [config-server:8888]
    relabel_configs:
      - source_labels: [__address__]
        target_label: service

  - job_name: eureka
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [eureka:8761]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-gateway:8080]

  # Microservicios de negocio
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [auth-service:8081]

  - job_name: document-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [document-service:8082]

  - job_name: asset-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [asset-service:8083]

  - job_name: version-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [version-service:8084]

  - job_name: sync-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [sync-service:8085]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [notification-service:8087]

  - job_name: render-service
    metrics_path: /metrics
    static_configs:
      - targets: [render-service:8086]

  # Infraestructura
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
