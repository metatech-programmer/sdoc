global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.resend.com:465"
  smtp_from: "alertas@sdoc.app"
  smtp_auth_username: "resend"
  smtp_auth_password: "${RESEND_API_KEY}"
  smtp_require_tls: true

route:
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 1h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      group_wait: 0s
      repeat_interval: 15m

receivers:
  - name: default
    email_configs:
      - to: "ops@sdoc.app"
        subject: "[SDOC] Alerta: {{ .GroupLabels.alertname }}"

  - name: critical-alerts
    email_configs:
      - to: "ops@sdoc.app"
        subject: "[SDOC CRÍTICO] {{ .GroupLabels.alertname }}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [service]
