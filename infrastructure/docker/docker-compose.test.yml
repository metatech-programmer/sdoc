# Stack mínimo para tests de integración en CI.
# Sin UI, sin monitoreo, sin servicios de aplicación.
# Uso: docker compose -f docker-compose.test.yml up -d
services:

  postgres-test:
    image: postgres:16-alpine
    container_name: sdoc-test-postgres
    environment:
      POSTGRES_USER: sdoc_test
      POSTGRES_PASSWORD: sdoc_test
      POSTGRES_DB: sdoc_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdoc_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7.2-alpine
    container_name: sdoc-test-redis
    ports:
      - "6380:6379"
    command: redis-server --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper-test:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sdoc-test-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    tmpfs:
      - /var/lib/zookeeper/data
      - /var/lib/zookeeper/log

  kafka-test:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sdoc-test-kafka
    depends_on:
      - zookeeper-test
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-test:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 60000
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  minio-test:
    image: minio/minio:latest
    container_name: sdoc-test-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: sdoc-test-network
