# Overrides para el entorno de producción
global:
  imagePullPolicy: IfNotPresent

services:
  apiGateway:
    replicas: 3
    hpa:
      minReplicas: 3
      maxReplicas: 20
  documentService:
    replicas: 3
    hpa:
      minReplicas: 3
      maxReplicas: 15
  syncService:
    replicas: 3
    hpa:
      minReplicas: 3
      maxReplicas: 12
  renderService:
    replicas: 4
    resources:
      requests: { cpu: 1000m, memory: 2Gi }
      limits: { cpu: 4000m, memory: 4Gi }

ingress:
  host: app.sdoc.app
  tls:
    secretName: sdoc-production-tls

networkPolicy:
  enabled: true

pdb:
  enabled: true
  minAvailable: 2
