{{/*
Los secretos reales se gestionan con External Secrets Operator + Vault.
Este archivo crea el ExternalSecret que sincroniza Vault → Kubernetes Secret.
Si no hay ESO instalado, se puede crear el Secret manualmente con kubectl.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sdoc-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdoc.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sdoc-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.vaultSecretPath }}/database
    - extract:
        key: {{ .Values.secrets.vaultSecretPath }}/redis
    - extract:
        key: {{ .Values.secrets.vaultSecretPath }}/keycloak
    - extract:
        key: {{ .Values.secrets.vaultSecretPath }}/storage
    - extract:
        key: {{ .Values.secrets.vaultSecretPath }}/encryption
    - extract:
        key: {{ .Values.secrets.vaultSecretPath }}/email
