{{/* ─── Auth Service ───────────────────────────────────────────────────────── */}}
{{- if .Values.services.authService.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdoc.labels" . | nindent 4 }}
    app.kubernetes.io/name: auth-service
spec:
  replicas: {{ .Values.services.authService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: sdoc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.services.authService.port }}"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-service
          image: {{ .Values.global.registry }}-auth-service:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.authService.port }}
              name: http
          envFrom:
            - secretRef:
                name: sdoc-secrets
          resources:
            {{- toYaml .Values.services.authService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - port: {{ .Values.services.authService.port }}
      targetPort: http
{{- end }}

