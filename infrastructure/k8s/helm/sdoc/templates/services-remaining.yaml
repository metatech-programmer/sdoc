{{/* ─── Sync Service ───────────────────────────────────────────────────────── */}}
{{- if .Values.services.syncService.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdoc.labels" . | nindent 4 }}
    app.kubernetes.io/name: sync-service
spec:
  replicas: {{ .Values.services.syncService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sync-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sync-service
        app.kubernetes.io/part-of: sdoc
    spec:
      containers:
        - name: sync-service
          image: {{ .Values.global.registry }}-sync-service:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.syncService.port }}
              name: http
          envFrom:
            - secretRef:
                name: sdoc-secrets
          resources:
            {{- toYaml .Values.services.syncService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sync-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: sync-service
  ports:
    - port: {{ .Values.services.syncService.port }}
      targetPort: http
---
{{- if .Values.services.syncService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sync-service
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sync-service
  minReplicas: {{ .Values.services.syncService.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.syncService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.syncService.hpa.targetCPU }}
{{- end }}
{{- end }}

