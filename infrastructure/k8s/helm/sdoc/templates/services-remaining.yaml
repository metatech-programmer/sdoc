{{/*
Plantilla genérica para los servicios restantes (sin HPA).
Servicios cubiertos: config-server, eureka-server, auth-service,
asset-service, version-service, sync-service, notification-service, web.
*/}}

{{/* ─── Config Server ─────────────────────────────────────────────────────── */}}
{{- if .Values.services.configServer.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdoc.labels" . | nindent 4 }}
    app.kubernetes.io/name: config-server
spec:
  replicas: {{ .Values.services.configServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: sdoc
    spec:
      containers:
        - name: config-server
          image: {{ .Values.global.registry }}-config-server:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.configServer.port }}
              name: http
          envFrom:
            - secretRef:
                name: sdoc-secrets
          resources:
            {{- toYaml .Values.services.configServer.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: config-server
  ports:
    - port: {{ .Values.services.configServer.port }}
      targetPort: http
{{- end }}

