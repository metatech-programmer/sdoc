server:
  port: 8081

spring:
  application:
    name: auth-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

# Keycloak Admin API
keycloak:
  url: ${KEYCLOAK_URL:http://keycloak:8080}
  realm: sdoc
  client-id: ${KEYCLOAK_CLIENT_ID:sdoc-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin:
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
