# ============================================================
# Configuración global — heredada por TODOS los microservicios
# ============================================================

server:
  shutdown: graceful

spring:
  # Virtual Threads — Java 21 Project Loom
  threads:
    virtual:
      enabled: true

  # Base de datos — Hikari pool
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:sdoc_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: ${spring.application.name}-HikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "app.sdoc.*"
        schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: true

  # OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/sdoc
          jwk-set-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/sdoc/protocol/openid-connect/certs

  # Lifecycle graceful shutdown
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Actuator / Observabilidad
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,circuitbreakers,refresh
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
  tracing:
    sampling:
      probability: 1.0

# OpenTelemetry
otel:
  exporter:
    otlp:
      endpoint: ${JAEGER_ENDPOINT:http://jaeger:4317}
  resource:
    attributes:
      service.name: ${spring.application.name}

# Resilience4j — defaults globales (cada servicio puede sobreescribir por instancia)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - feign.FeignException$ServiceUnavailable

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - feign.RetryableException

  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 100ms

  timelimiter:
    configs:
      default:
        timeout-duration: 10s

# Logging estructurado (JSON para Loki)
logging:
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%level",
      "service":"${spring.application.name}","traceId":"%X{traceId}",
      "spanId":"%X{spanId}","message":"%msg","logger":"%logger{36}"}%n
  level:
    app.sdoc: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.kafka: INFO

# Scheduling (OutboxPoller)
scheduling:
  enabled: true
