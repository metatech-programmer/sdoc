server:
  port: 8084

spring:
  application:
    name: version-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:sdoc-admin}
  secret-key: ${MINIO_ROOT_PASSWORD}
  buckets:
    versions: sdoc-versions

sdoc:
  versioning:
    auto-snapshot-every-n-changes: 10
    max-versions-per-document: 100
