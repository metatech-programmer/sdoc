server:
  port: 8083

spring:
  application:
    name: asset-service
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:sdoc-admin}
  secret-key: ${MINIO_ROOT_PASSWORD}
  buckets:
    assets: sdoc-assets
    documents: sdoc-documents
    exports: sdoc-exports
    previews: sdoc-previews
