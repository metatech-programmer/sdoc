name: Escaneo de seguridad

on:
  push:
    branches: [main]
  schedule:
    # Escaneo semanal los lunes a las 3:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy — vulnerabilidades de imágenes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - document-service
          - auth-service
          - api-gateway
          - render-service
          - web

    steps:
      - uses: actions/checkout@v4

      - name: Escanear imagen ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/sdoc-${{ matrix.service }}:latest
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Subir resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  gitleaks:
    name: Gitleaks — detección de secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
