name: CD — Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagen a desplegar (p.ej. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sdoc

jobs:
  deploy-production:
    name: Desplegar en Producción
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Determinar tag de imagen
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Configurar kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Instalar Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.15.0"

      - name: Deploy con Helm — production
        run: |
          helm upgrade --install sdoc infrastructure/k8s/helm/sdoc \
            --namespace sdoc-production \
            --create-namespace \
            --values infrastructure/k8s/helm/sdoc/values-production.yaml \
            --set global.imageTag=${{ steps.tag.outputs.IMAGE_TAG }} \
            --set global.registry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --atomic \
            --cleanup-on-fail \
            --timeout 15m

      - name: Verificar rollout
        run: |
          kubectl rollout status deployment -n sdoc-production --timeout=10m
          kubectl get pods -n sdoc-production -o wide

      - name: Crear release en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "SDOC ${{ github.ref_name }}"
          draft: false
          prerelease: false
