name: Deploy spec-site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "SPEC.md"
      - "apps/spec-site/**"
      - "packages/sdoc-format/src/schemas/**"
      - "packages/sdoc-format/examples/**"
      - ".github/workflows/deploy-spec-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "spec-site-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate spec site
        run: node apps/spec-site/build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/spec-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
