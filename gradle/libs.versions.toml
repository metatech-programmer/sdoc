[versions]
springBoot = "3.3.1"
springCloud = "2023.0.2"
springDependencyManagement = "1.1.5"
kotlin = "1.9.24"
java = "21"

# Spring Data / Integrations
springKafka = "3.2.1"
springVault = "3.1.1"
confluent = "7.6.1"
avro = "1.11.3"
gradleAvroPlugin = "1.9.1"

# Database
postgresql = "42.7.3"
flyway = "10.14.0"
hypersistenceUtils = "3.7.4"

# Observability
micrometerPrometheus = "1.13.1"
opentelemetrySpringBoot = "2.4.0"
logstashLogback = "7.4"

# Code generation / Utilities
mapstruct = "1.5.5.Final"
lombok = "1.18.32"

# MinIO
minio = "8.5.10"
thumbnailator = "0.4.21"
springdocOpenapi = "2.5.0"
unleash = "9.2.0"

# Testing
testcontainers = "1.19.8"
restAssured = "5.4.0"
archunit = "1.3.0"

[libraries]
# Spring Boot Starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

# Spring Cloud
spring-cloud-starter-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }
spring-cloud-starter-config = { module = "org.springframework.cloud:spring-cloud-starter-config" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
spring-cloud-starter-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }
spring-cloud-starter-circuitbreaker-reactor-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }

# Kafka
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
kafka-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }
kafka-schema-registry-client = { module = "io.confluent:kafka-schema-registry-client", version.ref = "confluent" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }

# Vault
spring-vault-core = { module = "org.springframework.vault:spring-vault-core", version.ref = "springVault" }
spring-cloud-starter-vault-config = { module = "org.springframework.cloud:spring-cloud-starter-vault-config" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hypersistence-utils = { module = "io.hypersistence:hypersistence-utils-hibernate-63", version.ref = "hypersistenceUtils" }

# Observabilidad
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometerPrometheus" }
opentelemetry-spring-boot = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "opentelemetrySpringBoot" }
logstash-logback = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogback" }

# Code generation
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# MinIO / Storage
minio = { module = "io.minio:minio", version.ref = "minio" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
springdoc-openapi-starter = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }
springdoc-openapi-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdocOpenapi" }
unleash-client = { module = "io.getunleash:unleash-client-java", version.ref = "unleash" }

# Testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
testcontainers-vault = { module = "org.testcontainers:vault" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[bundles]
spring-boot-common = ["spring-boot-starter-web", "spring-boot-starter-data-jpa", "spring-boot-starter-security", "spring-boot-starter-actuator", "spring-boot-starter-validation"]
spring-cloud-service = ["spring-cloud-starter-eureka-client", "spring-cloud-starter-config", "spring-cloud-starter-openfeign", "spring-cloud-starter-loadbalancer", "spring-cloud-starter-circuitbreaker-resilience4j"]
database = ["postgresql", "flyway-core", "flyway-postgresql"]
observability = ["micrometer-prometheus", "logstash-logback"]
testing-base = ["spring-boot-starter-test", "testcontainers-junit", "testcontainers-postgresql"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "gradleAvroPlugin" }
